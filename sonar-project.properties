sonar.projectKey=smart-office-iot
sonar.projectName=Smart Office IoT
sonar.sourceEncoding=UTF-8

# La primera línea base de SonarQube cubre el backend y el panel web. El código
# C++ del ESP32 necesita una captura de compilación compatible con CFamily, por
# lo que no se incluye para evitar un análisis parcial o engañoso.
sonar.sources=backend/flask/final_project/app,frontend/dashboard/src
sonar.tests=backend/flask/final_project/tests,frontend/dashboard/src
sonar.test.inclusions=backend/flask/final_project/tests/test_*.py,frontend/dashboard/src/**/*.test.ts,frontend/dashboard/src/**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/__pycache__/**
sonar.coverage.exclusions=frontend/dashboard/src/app/layout.tsx,frontend/dashboard/src/app/loading.tsx

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/flask/final_project/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/dashboard/coverage/lcov.info
