name: Firmware CI

on:
  pull_request:
    branches: [development]
    paths:
      - 'firmware/esp32/**'

jobs:
  test:
    name: PlatformIO – Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run unit tests
        run: pio test -e native_test -v
