name: Quality Gate - Linters

on:
  pull_request:
    branches: [main, development, develop]
  push:
    branches: [main]

jobs:
  lint-backend:
    name: Backend Lint (Flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/flask/final_project
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install flake8

      - name: Run Flake8
        run: flake8 app/ --count --show-source --statistics

  lint-frontend:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  lint-firmware:
    name: Firmware Lint (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check code formatting
        working-directory: firmware/esp32
        run: |
          find src include \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -exec clang-format --dry-run --Werror {} +

  quality-gate:
    name: Quality Gate (All Linters)
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, lint-firmware]
    if: always()
    steps:
      - name: Check linters status
        run: |
          if [ "${{ needs.lint-backend.result }}" != "success" ] || \
             [ "${{ needs.lint-frontend.result }}" != "success" ] || \
             [ "${{ needs.lint-firmware.result }}" != "success" ]; then
            echo "::error::Quality Gate Failed! One or more linters failed."
            exit 1
          fi
          echo "Quality Gate Passed! All linters succeeded."
