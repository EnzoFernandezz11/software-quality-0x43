apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: soft-eng
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: soft-eng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: app-env
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: soft-eng
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-backend
  namespace: soft-eng
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-backend
  template:
    metadata:
      labels:
        app: flask-backend
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: [sh, -c, 'until pg_isready -h postgres -p 5432; do sleep 2; done']
      containers:
        - name: flask-backend
          image: soft-eng-flask:local
          imagePullPolicy: Never
          command: ["python", "main.py"]
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            # Use POSTGRES_*; the host .env URL points outside Kubernetes.
            - name: DATABASE_URL
              value: ""
            - name: FLASK_DEBUG
              value: "0"
            - name: FLASK_PORT
              value: "5000"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/dashboard/history?limit=1
              port: 5000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flask-backend
  namespace: soft-eng
spec:
  selector:
    app: flask-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dashboard
  namespace: soft-eng
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-dashboard
  template:
    metadata:
      labels:
        app: frontend-dashboard
    spec:
      containers:
        - name: frontend-dashboard
          image: soft-eng-dashboard:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-dashboard
  namespace: soft-eng
spec:
  selector:
    app: frontend-dashboard
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: soft-eng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@softeng.com
            - name: PGADMIN_DEFAULT_PASSWORD
              value: admin
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: soft-eng
spec:
  selector:
    app: pgadmin
  ports:
    - port: 80
      targetPort: 80
