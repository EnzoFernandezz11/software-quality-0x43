# PLANTILLA de referencia: NO se aplica tal cual ni se commitean valores reales.
# Vive en examples/ para que aplicar la carpeta k8s/ (no recursivo) no la tome.
# deploy.sh crea este Secret con los valores de tu .env (POSTGRES_USER,
# POSTGRES_PASSWORD, FLASK_SECRET_KEY) usando `kubectl create secret generic`.
#
# Para crearlo a mano:
#   kubectl -n terrasense create secret generic terrasense-secrets \
#     --from-literal=POSTGRES_USER=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=FLASK_SECRET_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: terrasense-secrets
  namespace: terrasense
type: Opaque
stringData:
  POSTGRES_USER: "<usuario>"
  POSTGRES_PASSWORD: "<contraseña>"
  FLASK_SECRET_KEY: "<secret-key>"
