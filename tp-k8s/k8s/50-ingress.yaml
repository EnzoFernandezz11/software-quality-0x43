# Basado en la plantilla del Anexo C de la consigna.
#   api.terrasense.local -> Service back:5000  (ESP32, k6)
#   terrasense.local     -> Service front:3000 (navegador)
# Requiere `minikube addons enable ingress` y el mapeo en /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrasense-ingress
  namespace: terrasense
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.terrasense.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: back
                port:
                  number: 5000
    - host: terrasense.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  number: 3000
