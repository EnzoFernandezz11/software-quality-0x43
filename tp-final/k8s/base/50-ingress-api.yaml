# Ingress propio de la API (ESP32, k6 y llamadas del navegador).
#
# En el TP4 la API y el dashboard compartían un único Ingress. En el TP final el
# Ingress del dashboard lleva afinidad de sesión por cookie (ver ../ingress.yaml),
# y esa anotación se aplica a TODOS los upstreams del Ingress donde se declara:
# si la API siguiera ahí, cada navegador quedaría pegado a un único pod de `back`
# y el balanceo y el HPA dejarían de ser comparables con el TP4 (Anexo A.9).
# Por eso la regla de api.terrasense.local vive sola y sin afinidad.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrasense-api
  namespace: terrasense
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.terrasense.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: back
                port:
                  number: 5000
